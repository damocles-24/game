<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, user-scalable=no"
    >

    <title>Soafer Mini Game</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <main class="game-wrapper">

        <header class="game-header">

            <h1>
                Basta kung ano ganap ngayon

            </h1>

            <p>
                A mini game made just for you.
            </p>

        </header>


        <section
            id="game"
            aria-label="Happy Monthsary RPG game"
        ></section>


        <div class="desktop-instructions">

            <span>
                WASD / Arrow Keys — Move
            </span>

            <span>
                E — Interact
            </span>

        </div>


       

    </main>


    <script
        src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js">
    </script>

    <script src="game.js"></script>

</body>

</html>
